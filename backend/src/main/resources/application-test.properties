spring.application.name=receitasmedicas

server.port=0

spring.datasource.url=jdbc:h2:mem:sysprotect_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

jwt.secret=${JWT_SECRET_TEST}
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=2592000000

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springdoc=WARN

spring.sql.init.mode=never