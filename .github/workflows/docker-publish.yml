name: SysProtect CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, Test and Verify JaCoCo Coverage
        working-directory: backend
        run: mvn -B clean verify

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  docker-publish:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure Docker Image Environment
        run: |
          cp .env.example .env

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            IMAGE_ENV=prd
          else
            IMAGE_ENV=dev
          fi

          if grep -q '^DOCKER_IMAGE_ENV=' .env; then
            sed -i "s/^DOCKER_IMAGE_ENV=.*/DOCKER_IMAGE_ENV=${IMAGE_ENV}/" .env
          else
            echo "DOCKER_IMAGE_ENV=${IMAGE_ENV}" >> .env
          fi

          grep -E '^DOCKER_IMAGE_(ENV|TAG)=' .env

      - name: Build Docker Images
        run: docker compose build backend frontend

      - name: Docker Hub Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: loesterbotelho
          password: ${{ secrets.DOCKERHUB }}

      - name: Push Docker Images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker compose push backend frontend